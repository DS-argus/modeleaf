name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds the Tier-A (ad-hoc signed) app, attaches the zip, and generates
# release notes from the pull requests merged since the previous tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build + publish
    runs-on: macos-latest
    env:
      # CI has no signing identity; force a deterministic ad-hoc signature so the
      # local and CI Tier-A builds match. Swap this out when moving to Tier B.
      XCODEBUILD_EXTRA_ARGS: >-
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY=-
        CODE_SIGNING_ALLOWED=YES
        DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and package
        id: pkg
        run: |
          set -o pipefail
          Tools/package_release.sh | tee -a "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.zip }}" \
            --title "Modeleaf ${{ steps.pkg.outputs.version }}" \
            --generate-notes

      - name: Cask update reminder
        run: |
          echo "::notice title=Homebrew cask::Bump DS-argus/homebrew-tap Casks/modeleaf.rb -> version ${{ steps.pkg.outputs.version }}, sha256 ${{ steps.pkg.outputs.sha256 }}"
