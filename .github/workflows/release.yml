name: Release

# A v-prefixed version tag is the single release entrypoint. This workflow
# verifies the tag, tests and packages the app, stages a draft GitHub Release,
# publishes the matching Homebrew cask, and only then makes the release public.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify + build + publish
    runs-on: macos-latest
    env:
      XCODEBUILD_EXTRA_ARGS: >-
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY=-
        CODE_SIGNING_ALLOWED=YES
        DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain fingerprint
        id: toolchain
        run: echo "fingerprint=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: modeleaf-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}-release-${{ github.sha }}
          restore-keys: |
            modeleaf-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}-app-
            modeleaf-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved') }}-core-

      - name: Verify tag matches the app version
        id: version
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' PDFReaderApp/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 Tools/release_notes.py validate \
            --version "$VERSION" \
            --summary "release-notes/${VERSION}.txt"

      - name: Run tests
        run: Tools/verify.sh full --disable-automatic-resolution

      - name: Test release note composition
        run: python3 Tools/test_release_notes.py

      - name: Build and package
        id: pkg
        run: |
          set -euo pipefail
          Tools/package_release.sh | tee -a "$GITHUB_OUTPUT"

      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          summary="release-notes/${VERSION}.txt"
          release_json="$work/release.json"
          generated="$work/generated.md"
          body="$work/body.md"
          existing_release=false

          # A draft is updated from its current body so a rerun never loses
          # generated sections. A published release is immutable here.
          if gh release view "$GITHUB_REF_NAME" --json isDraft,body > "$release_json"; then
            existing_release=true
            draft=$(python3 - "$release_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              release = json.load(handle)
          print("true" if release.get("isDraft") else "false")
          PY
            )
            if [ "$draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to rewrite it" >&2
              exit 1
            fi
            python3 - "$release_json" > "$generated" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              release = json.load(handle)
          sys.stdout.write(release.get("body") or "")
          PY
            if [ -z "$(tr -d '[:space:]' < "$generated")" ]; then
              echo "Draft $GITHUB_REF_NAME has no generated notes; regenerating them" >&2
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                -f target_commitish="$GITHUB_SHA" \
                --jq '.body // ""' > "$generated"
            fi
          else
            # GitHub's generate-notes endpoint is the supported API equivalent
            # of gh release create --generate-notes, and is deterministic for
            # this tag's target commit.
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.body // ""' > "$generated"
          fi

          python3 Tools/release_notes.py compose \
            --version "$VERSION" \
            --summary "$summary" \
            --generated "$generated" \
            --output "$body"

          if [ "$existing_release" = true ]; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Modeleaf $VERSION" \
              --notes-file "$body"
            gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.pkg.outputs.zip }}" \
              --title "Modeleaf $VERSION" \
              --notes-file "$body" \
              --draft
          fi

      - name: Publish Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is required to publish DS-argus/homebrew-tap" >&2
            exit 1
          }
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh repo clone DS-argus/homebrew-tap "$tap_dir"
          python3 - "$tap_dir/Casks/modeleaf.rb" "$VERSION" "$SHA256" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          sha256 = sys.argv[3]
          source = path.read_text()
          source, version_count = re.subn(r'^  version ".*"$', f'  version "{version}"', source, count=1, flags=re.MULTILINE)
          source, sha_count = re.subn(r'^  sha256 ".*"$', f'  sha256 "{sha256}"', source, count=1, flags=re.MULTILINE)
          if version_count != 1 or sha_count != 1:
              raise SystemExit("Casks/modeleaf.rb does not contain one version and sha256 declaration")
          binary = '  binary "#{appdir}/Modeleaf.app/Contents/SharedSupport/modeleaf"'
          if binary not in source:
              source, app_count = re.subn(
                  r'^  app "Modeleaf\.app"$',
                  '  app "Modeleaf.app"\n\n' + binary,
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if app_count != 1:
                  raise SystemExit("Casks/modeleaf.rb does not contain one Modeleaf.app artifact")
          path.write_text(source)
          PY
          ruby -c "$tap_dir/Casks/modeleaf.rb"
          git -C "$tap_dir" diff --check
          if git -C "$tap_dir" diff --quiet; then
            echo "Homebrew cask already points to $VERSION"
          else
            git -C "$tap_dir" config user.name "github-actions[bot]"
            git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$tap_dir" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/DS-argus/homebrew-tap.git"
            git -C "$tap_dir" add Casks/modeleaf.rb
            git -C "$tap_dir" commit -m "modeleaf $VERSION"
            git -C "$tap_dir" push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --title "Modeleaf ${{ steps.pkg.outputs.version }}" \
            --draft=false

      - name: Release receipt
        run: |
          echo "Released Modeleaf ${{ steps.pkg.outputs.version }}"
          echo "Homebrew SHA-256: ${{ steps.pkg.outputs.sha256 }}"
